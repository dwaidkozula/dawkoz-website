<script>
'use strict';
const clamp=x=>Math.max(0,Math.min(1,x));
const ease=x=>1-Math.pow(1-clamp(x),3);
const el=id=>document.getElementById(id);
const opacity=(id,value)=>el(id).style.opacity=value.toFixed(4);
const slide=(id,value,offset=25)=>{opacity(id,ease(value));el(id).setAttribute('transform',`translate(0 ${((1-ease(value))*offset).toFixed(3)})`)};
const ranges=[[0,5.3],[4.9,11.8],[11.35,17.7],[17.25,21.75],[21.35,26]];
window.renderFrame=function(time){
 const t=Math.max(0,Math.min(25,time));
 ranges.forEach(([start,end],index)=>{
  const into=(t-start)/.55, out=(end-t)/.4;
  opacity('s'+(index+1),ease(into)*ease(out));
 });
 const intro=ease(t/.8);
 opacity('masthead',intro*(1-ease((t-21.2)/.4)));
 opacity('footer',intro*(1-ease((t-21.2)/.4)));
 el('ambient').setAttribute('cx',1430+Math.sin(t*.23)*90);
 el('ambient').setAttribute('opacity',.85+Math.sin(t*.4)*.1);
 for(let i=1;i<=4;i++)slide('s'+i+'-copy',(t-ranges[i-1][0])/.8);
 slide('incoming',(t-.2)/.9,42);
 for(let i=1;i<=2;i++){
  const p=((t*.5+(i-1)*.5)%1);
  el('ring'+i).setAttribute('r',90+p*58);
  opacity('ring'+i,(1-p)*.24);
 }
 el('phone-icon').setAttribute('transform',`translate(1395 374) rotate(${Math.sin(t*11)*Math.max(0,1-t/4)*3} 30 30) scale(2.5)`);
 slide('chat-header',(t-5.05)/.6);
 [5.55,6.7,8.05,9.25].forEach((start,index)=>slide('chat'+(index+1),(t-start)/.55,22));
 opacity('chat-note',ease((t-10)/.6));
 for(let i=0;i<23;i++){
  const h=8+Math.abs(Math.sin(t*5+i*.82)*Math.cos(t*2-i*.22))*48;
  el('bar'+i).setAttribute('height',h.toFixed(2));el('bar'+i).setAttribute('y',((60-h)/2).toFixed(2));
 }
 slide('report',(t-11.55)/.8,40);
 [12.05,13.25,14.45].forEach((start,index)=>slide('field'+(index+1),(t-start)/.6,13));
 opacity('report-status',ease((t-15.4)/.6));opacity('data-ready',ease((t-15.7)/.7));
 slide('dispatch-ai',(t-17.45)/.7);slide('team-card',(t-17.75)/.8,30);
 opacity('dispatch-line',ease((t-17.9)/.5));
 const packet=clamp((t-18.3)/.85);
 el('packet').setAttribute('cx',1156+packet*89);
 opacity('packet',t<18.3?0:1-ease((t-19.05)/.25));
 opacity('delivered',ease((t-19.1)/.7));
 slide('end-logo',(t-21.4)/.85,22);slide('end-copy',(t-21.7)/.8,16);slide('end-cta',(t-22.1)/.8,14);
 const phases=[[0,5.15],[5.15,11.55],[11.55,17.45],[17.45,21.4]];
 phases.forEach(([start,end],i)=>{
  el('step-line'+i).setAttribute('width',400*clamp((t-start)/(end-start)));
  el('step-label'+i).setAttribute('fill',t>=start?'#b8c9e4':'#566378');
 });
};
const controlled=new URLSearchParams(location.search).has('render');
if(controlled)document.body.classList.add('render');
window.renderFrame(0);
if(!controlled){
 let playing=true,time=0,last=performance.now();
 el('toggle').onclick=()=>{playing=!playing;el('toggle').textContent=playing?'Pauza':'Odtwórz'};
 el('restart').onclick=()=>{time=0;playing=true;el('toggle').textContent='Pauza'};
 function tick(now){if(playing)time=(time+(now-last)/1000)%25;last=now;window.renderFrame(time);requestAnimationFrame(tick)}requestAnimationFrame(tick);
}
</script></body></html>
